name: Quality checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content and types
        run: npm run check

      - name: Check formatting and lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
